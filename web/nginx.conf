# ConciliaTower static site. index.html, index.js and index.wasm are one
# matched set (every EM_ASM in the wasm indexes the JS glue's table), so the
# browser must revalidate all three on each load — cheap 304s when nothing
# changed — and the Makefile also stamps their URLs with a build hash.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    location ~* \.(html|js|wasm)$ {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
